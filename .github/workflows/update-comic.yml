name: Update comic

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (so TRMNL almost always sees a new one)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch random C&H comic and write image URL to comic.json
        run: |
          python3 <<'EOF'
          import json, re, urllib.request

          # Fetch the random comic page. explosm.net redirects to a specific
          # comic URL like /comics/<slug>; urllib follows redirects by default.
          # Use a desktop User-Agent — some Next.js sites return different HTML
          # to bots vs browsers.
          req = urllib.request.Request(
              "https://explosm.net/comics/random",
              headers={
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                                "(KHTML, like Gecko) Chrome/120 Safari/537.36"
              }
          )
          html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "ignore")

          # The comic image URL is hosted at static.explosm.net with a
          # date-coded directory path (YYYY/MM/<long-digits>/<slug>.png).
          # This pattern excludes author photos (e.g. /2021/11/rob.jpg) and
          # marketing assets.
          pattern = re.compile(
              r'https://static\.explosm\.net/\d{4}/\d{2}/\d{6,}/[^/\s"\'<>]+\.(?:png|jpg|jpeg|gif)'
          )
          m = pattern.search(html)

          if m:
              img_url = m.group(0)
          else:
              # Fallback: any static.explosm.net image with a date path.
              # Better to show *something* than break the dashboard.
              fallback = re.search(
                  r'https://static\.explosm\.net/\d{4}/\d{2}/[^\s"\'<>]+\.(?:png|jpg|jpeg|gif)',
                  html
              )
              img_url = fallback.group(0) if fallback else ""

          data = {"img": img_url}
          with open("comic.json", "w") as f:
              json.dump(data, f, indent=2)

          print(f"Wrote comic URL: {img_url}")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add comic.json
          git diff --cached --quiet || git commit -m "Update comic"
          git push
