name: Update news

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch BBC RSS and write 10 titles to news.json
        run: |
          python3 <<'EOF'
          import json, re, urllib.request
          from html import unescape

          url = "https://feeds.bbci.co.uk/news/world/rss.xml"
          xml = urllib.request.urlopen(url, timeout=20).read().decode("utf-8", "ignore")

          items = re.findall(r"<item\b.*?</item>", xml, re.S)
          titles = []
          for it in items:
              m = re.search(r"<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>", it, re.S)
              if m:
                  titles.append(unescape(m.group(1)).strip())
              if len(titles) >= 10:
                  break

          data = {"articles": [{"title": t} for t in titles]}
          with open("news.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news"
          git push
