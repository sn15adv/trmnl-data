name: Update quote

on:
  schedule:
    - cron: '15 8 * * *'   # once daily at 08:15 UTC (after zenquotes midnight CST = 06:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's quote and write quote.json
        run: |
          python3 <<'EOF'
          import json, urllib.request

          # ZenQuotes "today" endpoint returns a JSON array with one object.
          # Shape: [{"q": "quote text", "a": "Author", "h": "<blockquote>..."}]
          req = urllib.request.Request(
              "https://zenquotes.io/api/today",
              headers={"User-Agent": "trmnl-dashboard/1.0"}
          )
          data = json.loads(urllib.request.urlopen(req, timeout=20).read().decode("utf-8"))

          if isinstance(data, list) and data and "q" in data[0]:
              out = {"q": data[0]["q"], "a": data[0].get("a", "Unknown")}
          else:
              # Don't clobber a working file with garbage
              raise SystemExit("Unexpected response shape; keeping existing quote.json")

          with open("quote.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)

          print(f"Wrote quote: \"{out['q']}\" — {out['a']}")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quote.json
          git diff --cached --quiet || git commit -m "Update quote"
          git push
