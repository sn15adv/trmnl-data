name: Update seattle events

on:
  schedule:
    - cron: '30 13 * * *'   # daily at 13:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Seattle events from Ticketmaster
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: |
          python3 <<'EOF'
          import json, os, sys, urllib.request, urllib.parse
          from datetime import datetime, timedelta, timezone

          KEY = os.environ["TICKETMASTER_KEY"]

          # Window: now to 14 days from now
          now = datetime.now(timezone.utc).replace(microsecond=0)
          end = now + timedelta(days=14)
          start_str = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          end_str = end.strftime("%Y-%m-%dT%H:%M:%SZ")

          # Lat/long for Seattle center; 50 mile radius covers Bellevue, Everett,
          # Tacoma — the whole metro area. More reliable than dmaId.
          params = {
              "apikey": KEY,
              "latlong": "47.6062,-122.3321",
              "radius": "50",
              "unit": "miles",
              "startDateTime": start_str,
              "endDateTime": end_str,
              "size": "30",
              "sort": "date,asc",
          }
          query = urllib.parse.urlencode(params)
          url = f"https://app.ticketmaster.com/discovery/v2/events.json?{query}"

          print(f"Requesting: {url.replace(KEY, '<REDACTED>')}")

          req = urllib.request.Request(url, headers={"Accept": "application/json"})
          try:
              raw = urllib.request.urlopen(req, timeout=30).read()
          except Exception as e:
              print(f"HTTP error: {e}")
              # Don't fail the workflow — just keep existing JSON
              sys.exit(0)

          data = json.loads(raw)
          events_raw = data.get("_embedded", {}).get("events", [])
          print(f"Received {len(events_raw)} events from Ticketmaster")

          if not events_raw:
              # No events found — log and exit cleanly (don't error)
              print("No events found; keeping existing seattle_events.json")
              sys.exit(0)

          events = []
          for e in events_raw[:8]:
              date_info = e.get("dates", {}).get("start", {})
              local_date = date_info.get("localDate", "")
              local_time = date_info.get("localTime", "")

              venues = e.get("_embedded", {}).get("venues", [])
              venue_name = venues[0].get("name", "") if venues else ""

              classifications = e.get("classifications", [])
              segment = ""
              genre = ""
              if classifications:
                  c = classifications[0]
                  segment = c.get("segment", {}).get("name", "") or ""
                  genre = c.get("genre", {}).get("name", "") or ""

              events.append({
                  "name": (e.get("name", "") or "")[:50],
                  "date": local_date,
                  "time": local_time,
                  "venue": venue_name[:35],
                  "segment": segment,
                  "genre": genre,
              })

          def pretty_date(iso_date):
              try:
                  dt = datetime.strptime(iso_date, "%Y-%m-%d")
                  return dt.strftime("%a %b %-d")
              except Exception:
                  return iso_date

          for ev in events:
              ev["date_pretty"] = pretty_date(ev["date"])

          hero = events[0]
          others = events[1:]
          output = {"hero": hero, "others": others}

          with open("seattle_events.json", "w") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
          print(f"Wrote seattle_events.json: hero='{hero['name']}' + {len(others)} others")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seattle_events.json
          git diff --cached --quiet || git commit -m "Update Seattle events"
          git push
